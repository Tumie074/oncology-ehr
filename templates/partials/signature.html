<div class="sm:col-span-2" data-sigpad>
  <label class="mb-1 block text-sm font-medium text-ink">{{ field.label }}{% if field.field.required %} <span class="text-alert-500" aria-hidden="true">*</span>{% endif %}</label>
  <div class="rounded border border-slate-300 bg-white">
    <canvas class="block h-36 w-full touch-none cursor-crosshair rounded" width="700" height="180" aria-label="{{ field.label }} drawing area"></canvas>
  </div>
  {{ field }}
  <div class="mt-1 flex items-center justify-between text-xs text-slate-500">
    <span>Draw with your finger, stylus or mouse.</span>
    <button type="button" data-sig-clear class="font-semibold text-clinical-600 hover:underline">Clear</button>
  </div>
  {% for e in field.errors %}<p class="mt-1 text-xs font-medium text-alert-600" role="alert">{{ e }}</p>{% endfor %}
</div>
