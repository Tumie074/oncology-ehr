<script>
(function(){
  document.querySelectorAll('[data-sigpad]').forEach(function(box){
    var cv = box.querySelector('canvas'), input = box.querySelector('input[type=hidden]'), ctx = cv.getContext('2d'), drawing = false, dirty = false;
    ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#2E1448';
    function pos(e){ var r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; }
    function save(){ if (dirty) input.value = cv.toDataURL('image/png'); }
    function restore(){ if (input.value.indexOf('data:image/png') === 0) { var img = new Image(); img.onload = function(){ ctx.drawImage(img, 0, 0, cv.width, cv.height); dirty = true; }; img.src = input.value; } }
    cv.addEventListener('pointerdown', function(e){ drawing = true; dirty = true; var p = pos(e); ctx.beginPath(); ctx.moveTo(p[0], p[1]); cv.setPointerCapture(e.pointerId); e.preventDefault(); });
    cv.addEventListener('pointermove', function(e){ if (!drawing) return; var p = pos(e); ctx.lineTo(p[0], p[1]); ctx.stroke(); });
    ['pointerup','pointercancel','pointerleave'].forEach(function(ev){ cv.addEventListener(ev, function(){ if (drawing) { drawing = false; save(); } }); });
    box.querySelector('[data-sig-clear]').addEventListener('click', function(){ ctx.clearRect(0, 0, cv.width, cv.height); input.value = ''; dirty = false; });
    restore();
  });
})();
</script>
