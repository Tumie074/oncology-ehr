{% extends "base.html" %}{% block title %}No access{% endblock %}
{% block content %}
<div class="mx-auto max-w-md rounded border border-alert-500 bg-alert-50 p-6 text-center shadow-card" role="alert">
  <h2 class="text-lg font-semibold text-alert-600">Your role cannot do that</h2>
  <p class="mt-2 text-sm text-alert-600">Access is restricted by role{% if chrs_role %} (you are signed in as <strong>{{ chrs_role }}</strong>){% endif %}. The attempt has been recorded in the audit log.</p>
  <a href="/" class="mt-4 inline-block rounded bg-clinical-500 px-4 py-2 text-sm font-semibold text-white hover:bg-clinical-600">Back to dashboard</a>
</div>
{% endblock %}
